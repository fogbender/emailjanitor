name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Locked dependencies, format, compilation, and isolated tests
        run: nix develop --command bash -c 'mix deps.get && bash scripts/check'
      - name: Dependency security advisories
        run: nix develop --command mix hex.audit
